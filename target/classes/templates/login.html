<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{template_header :: head('Login')}"></head>
<body>

<div class="container pb-5 mb-5 mt-5">
    <div class="row justify-content-center pt-5">
        <div class="col-md-6 col-lg-4">
            <div class="card card-modern">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-indigo text-white rounded-circle shadow-sm mb-3" style="width: 60px; height: 60px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
                              <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5z"/>
                            </svg>
                        </div>
                        <h3 class="fw-bold text-dark">Acesso Restrito</h3>
                        <p class="text-muted">Faça login para gerenciar o catálogo.</p>
                    </div>
                    
                    <div th:if="${erro != null and !erro.isEmpty()}" class="alert alert-danger shadow-sm border-0 d-flex align-items-center" role="alert">
                        ⚠️ <span class="ms-2 fw-medium" th:text="${erro}"></span>
                    </div>

                    <form th:action="@{/usuario/autenticar}" method="POST">
                        <div class="mb-4">
                            <label for="login" class="form-label fw-medium text-dark">Usuário</label>
                            <input type="text" class="form-control form-control-lg bg-light border-0 shadow-none" id="login" name="login" required autofocus placeholder="Digite o login admin">
                        </div>
                        <div class="mb-5">
                            <label for="senha" class="form-label fw-medium text-dark">Senha</label>
                            <input type="password" class="form-control form-control-lg bg-light border-0 shadow-none" id="senha" name="senha" required placeholder="Sua senha secreta">
                        </div>
                        <div class="d-grid mt-2">
                            <button type="submit" class="btn btn-indigo btn-lg fw-bold shadow-sm rounded-pill">Entrar no Painel</button>
                        </div>
                        <div class="text-center mt-4 pt-3 border-top">
                            <a th:href="@{/loja}" class="text-decoration-none text-muted fw-medium">← Voltar para a Loja</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{template_rodape :: rodape}"></div>
</body>
</html>
