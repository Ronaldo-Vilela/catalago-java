<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{template_header :: head('Categoria')}"></head>
<body>
<div th:replace="~{template_menu1 :: menu}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0 text-dark">🏷️ Categoria</h2>
            <p class="text-muted mb-0">Adicione uma nova categoria de catálogo.</p>
        </div>
        <a th:href="@{/categoria}" class="btn btn-light shadow-sm border text-dark fw-medium rounded-pill px-4">Voltar</a>
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="card card-modern">
                <div class="card-body p-4 p-md-5">
                    <form method="post" th:action="@{/categoria/salvar}">
                        <div class="mb-5">
                            <label for="nome" class="form-label fw-medium text-dark">Nome da Categoria</label>
                            <input type="text" name="nome" id="nome" class="form-control form-control-lg bg-light border-0 shadow-none" th:value="${categoria != null ? categoria.nome : ''}" required autofocus placeholder="Ex: Informática, Games...">
                        </div>
                        <input type="hidden" name="idcategoria" th:value="${categoria != null ? categoria.idcategoria : ''}">
                        <div class="d-flex justify-content-end border-top pt-4">
                            <button type="submit" class="btn btn-indigo btn-lg px-4 shadow-sm rounded-pill w-100">Salvar Categoria</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{template_rodape :: rodape}"></div>
</body>
</html>
