<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{template_header :: head('Categorias')}"></head>
<body>
<div th:replace="~{template_menu1 :: menu}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0 text-dark">🏷️ Categorias</h2>
            <p class="text-muted mb-0">Gerencie as categorias estruturais da loja.</p>
        </div>
        <a th:href="@{/categoria/adicionar}" class="btn btn-indigo shadow-sm d-flex align-items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2z"/>
            </svg>
            Nova Categoria
        </a>
    </div>
    
    <div class="card card-modern">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-modern mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Nome da Categoria</th>                      
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="categoria : ${categorias}">
                            <td class="ps-4 fw-medium text-dark w-50">
                                <span class="d-flex align-items-center gap-2">
                                    <span class="rounded-circle bg-indigo opacity-25" style="width: 8px; height: 8px;"></span>
                                    <span th:text="${categoria.nome}"></span>
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/categoria/editar(id=${categoria.idcategoria})}" class="btn btn-sm btn-outline-primary fw-medium rounded-pill px-3">Editar</a>
                                <a th:href="@{/categoria/excluir(id=${categoria.idcategoria})}" class="btn btn-sm btn-outline-danger fw-medium rounded-pill px-3 ms-1" onclick="return confirm('Excluir esta categoria?');">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="2" class="text-center py-4 text-muted">Nenhuma categoria cadastrada.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{template_rodape :: rodape}"></div>
</body>
</html>
