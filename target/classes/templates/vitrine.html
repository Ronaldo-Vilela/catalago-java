<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{template_header :: head('Vitrine')}"></head>
<body>

<!-- Navegação Pública (Vitrine) -->
<nav class="navbar navbar-expand-lg navbar-light navbar-modern shadow-sm sticky-top">
    <div class="container py-1">
      <a class="navbar-brand text-indigo fw-bold d-flex align-items-center gap-2" th:href="@{/}">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-shop" viewBox="0 0 16 16">
          <path d="M2.97 1.35A1 1 0 0 1 3.736 1h8.528a1 1 0 0 1 .766.35l2.766 3.284a.56.56 0 0 1 .018.02A1.5 1.5 0 0 1 15 5.5V14a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5.5a1.5 1.5 0 0 1 .018-.112l.012-.02 2.752-3.35zM3.4 2l-2.4 2.85V14h14V4.85L12.6 2H3.4zV2z"/>
          <path d="M2 5.5v1h1v-1H2zm3 0v1h1v-1H5zm3 0v1h1v-1H8zm3 0v1h1v-1h-1zm3 0v1h1v-1h-1zM2 8v5h2V8H2zm4 0v5h2V8H6zm4 0v5h2V8h-2z"/>
        </svg>
        Catálogo Eletrônico
      </a>
      <div class="d-flex align-items-center">
          <a class="btn btn-outline-secondary btn-sm fw-bold rounded-pill px-4 text-dark shadow-sm border" th:href="@{/usuario/login}">
            <span class="me-1">🔒</span> Admin
          </a>
      </div>
    </div>
</nav>

<div class="py-5 mb-5 border-bottom text-center text-white" style="background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);">
    <div class="container py-4">
        <h1 class="display-4 fw-bold mb-3 text-white" style="letter-spacing: -1px;">Vitrine de Produtos</h1>
        <p class="lead mb-0 text-white-50">Descubra as novidades com os melhores preços do mercado.</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="produto : ${produtos}">
            <div class="card h-100 shadow-sm border-0 custom-card-hover" style="transition: transform 0.2s;">
                <img th:src="${produto.foto != null and produto.foto != ''} ? @{/fotos/{foto}(foto=${produto.foto})} : 'https://via.placeholder.com/400x300.png?text=Sem+Imagem'" class="card-img-top p-3" th:alt="${produto.nome}" style="height: 250px; object-fit: contain;">
                
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title fw-bold mb-0 text-dark" th:text="${produto.nome}"></h5>
                        <span class="badge bg-secondary" th:text="${produto.categoria != null ? produto.categoria.nome : ''}"></span>
                    </div>
                    
                    <h6 class="card-subtitle mb-3 text-muted" th:text="'Marca: ' + ${produto.marca}"></h6>
                    <p class="card-text flex-grow-1" th:text="${produto.descricao}"></p>
                    
                    <div class="mt-auto pt-3 border-top border-light">
                        <h3 class="text-success fw-bold text-center mb-0" th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></h3>
                    </div>
                </div>
                
                <div class="card-footer bg-white border-0 pb-4 pt-2">
                    <button class="btn btn-indigo w-100 fw-bold py-2 shadow-sm rounded-pill" onclick="alert('Funcionalidade de compra não implementada neste portfólio!')">Comprar Agora</button>
                </div>
            </div>
        </div>
        
        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(produtos)}">
            <h3 class="text-muted">Nenhum produto cadastrado no catálogo atualmente.</h3>
            <p>Acesse o painel restrito para adicionar produtos!</p>
        </div>
    </div>
</div>

<style>
.custom-card-hover:hover {
    transform: translateY(-5px) !important;
    box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
}
</style>

<div th:replace="~{template_rodape :: rodape}"></div>
</body>
</html>
